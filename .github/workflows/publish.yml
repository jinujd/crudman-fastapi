name: Publish to PyPI

# Publishes when a GitHub release is published. Uses PyPI Trusted Publishing, so no API token is stored.
# One-time setup on pypi.org → Account settings → Publishing → "Add a new pending publisher":
#   PyPI project name: crudman-fastapi   Owner: jinujd   Repository: crudman-fastapi
#   Workflow name: publish.yml           Environment name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before publishing
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/crudman-fastapi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
