[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "crudman-fastapi"
version = "0.1.1"
description = "Zero-boilerplate CRUD for FastAPI with SQLAlchemy, Pydantic validation, OpenAPI, uploads, caching and export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jinu Joseph Daniel" }]
keywords = ["fastapi", "crud", "sqlalchemy", "openapi", "swagger", "pagination", "uploads", "rest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.136.3",
    "starlette>=1.3.1",  # older versions have known vulnerabilities
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
uploads = ["python-multipart>=0.0.31"]
images = ["Pillow>=13.0.0"]
excel = ["openpyxl>=3.1"]
s3 = ["aioboto3>=13"]
redis = ["redis>=5"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "python-multipart>=0.0.31",
    "openpyxl>=3.1",
    "Pillow>=13.0.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/jinujd/crudman-fastapi"
Repository = "https://github.com/jinujd/crudman-fastapi"
Issues = "https://github.com/jinujd/crudman-fastapi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crudman"]

[tool.hatch.build.targets.sdist]
include = ["/src/crudman", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses Depends(...) as argument defaults

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["crudman"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["redis.*", "aioboto3", "openpyxl", "openpyxl.*", "PIL", "PIL.*"]
ignore_missing_imports = true
